name: MindLoom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  leak-guard:
    name: Privacy, Secret & Script Syntax Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run personal-path, secret & plugin-boundary leak scan
        run: node scripts/check-leaks.mjs
      - name: Validate bash installer syntax
        run: bash -n scripts/install.sh

  test-matrix:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.15.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install plugin devDependencies
        run: npm --prefix plugin ci --no-audit --no-fund
      - name: Run full Node test suite
        run: npm test
      - name: Validate PowerShell AST (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path "scripts","cli" -Filter "*.ps1" | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) { throw ($errors | Out-String) }
          }

  plugin-build:
    name: Companion Plugin Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install plugin dependencies
        run: npm --prefix plugin ci --no-audit --no-fund
      - name: Typecheck plugin
        run: npm run plugin:typecheck
      - name: Build plugin bundle
        run: npm run plugin:build
      - name: Verify release assets & dry-run BRAT package
        run: |
          node scripts/verify-release-assets.mjs
          mkdir -p release-assets
          cp plugin/dist/main.js plugin/dist/manifest.json plugin/dist/styles.css release-assets/
          (cd plugin/dist && zip -r ../../release-assets/mindloom-obsidian-plugin.zip main.js manifest.json styles.css)
          for f in release-assets/main.js release-assets/manifest.json release-assets/styles.css release-assets/mindloom-obsidian-plugin.zip; do
            test -s "$f" || (echo "Missing or empty asset: $f" && exit 1)
          done
